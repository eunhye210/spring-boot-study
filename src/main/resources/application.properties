spring.application.name=onus_crud_3
#server.port=9091

# Database Configuration
spring.datasource.url=jdbc:mysql://localhost:3301/crud_mysql?useSSL=false&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password

# Hibernate Properties (update / create-drop)
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQL8Dialect
spring.jpa.properties.hibernate.format_sql=true

# Optional: Pretty print JSON responses
spring.jackson.serialization.indent-output=true

# Mail Properties
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=tkrhd0210
spring.mail.password=
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

# Thymeleaf Configuration
spring.thymeleaf.cache=false
spring.thymeleaf.prefix=classpath:/templates/
spring.thymeleaf.suffix=.html
spring.thymeleaf.mode=HTML 
spring.thymeleaf.encoding=UTF-8

eunhye.openapi.dev-url=http://localhost:8080
eunhye.openapi.prod-url=https://eunhye-api.com
